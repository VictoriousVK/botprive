  - ["C'est quoi un FVG ?", "learn"]
  - ["Explique-moi la killzone de Londres", "learn"]
  - ["Quelle taille de lot pour mon challenge FTMO ?", "risk_check"]
  - ["Combien de risque avant la perte journalière ?", "risk_check"]
  - ["Quelles annonces NFP cette semaine ?", "research"]
  - ["Compile mon EA MQL5", "ea_factory"]
