name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A NON-superuser role: superusers bypass row-level security.
      HF_TEST_PG_URL: postgresql+psycopg://ae_app:ae_app@localhost:5432/ae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[research,web,saas,dev]"
      - name: PostgreSQL role for the RLS tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE ae_app LOGIN PASSWORD 'ae_app'"
          psql -h localhost -U postgres -c "CREATE DATABASE ae_test OWNER ae_app"
      - run: python scripts/check_secrets.py
      - run: ruff check hedgefund tests scripts --select F,E9,B --ignore B905,B008
      - run: python -m hedgefund validate
      - run: pytest -q
      - name: Scorecard (a catastrophic failure blocks the merge)
        run: python -m hedgefund.saas eval

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
      - run: test -f out/index.html && test -f out/compte/index.html && test -f out/admin/index.html
      - name: The committed site export is present
        run: test -f ../../hedgefund/web/site/index.html
