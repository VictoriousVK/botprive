name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[research,web,dev]"
      - run: ruff check hedgefund tests --select F,E9,B --ignore B905,B008
      - run: python -m hedgefund validate
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
      - run: test -f out/index.html && test -f out/compte/index.html && test -f out/admin/index.html
      - name: The committed site export is present
        run: test -f ../../hedgefund/web/site/index.html
