[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgefund"
version = "0.1.0"
description = "One-person 24/7 AI hedge fund: Opus 5.5 research, orchestrated workflows, Jev fast decisions, deterministic risk and execution."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
research = ["anthropic>=1.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["hedgefund*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
