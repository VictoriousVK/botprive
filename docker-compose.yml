# Environnement local : Postgres seul par défaut.
#   docker compose up -d db
# Pile complète (site + worker) construite depuis les Dockerfiles :
#   docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: victorious
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/victorious
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/victorious
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
