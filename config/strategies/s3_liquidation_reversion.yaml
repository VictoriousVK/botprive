id: liq_cascade_reversion
name: Liquidation-cascade reversion (long after forced selling clears)
version: 1
owner_desk: quant
stage: data             # implemented + tested offline; next gate needs >=1y of real point-in-time data
impl: hedgefund.strategy.library.liquidation:LiquidationReversion
edge_source: liquidity_provision
hypothesis: >
  Leverage-driven liquidation cascades push prices below levels justified by information
  because forced sellers are price-insensitive. Once open interest has flushed and funding
  has reset, the forced flow is exhausted and prices partially revert. We are paid for
  providing liquidity when others are forced to take it - but only after the flow clears,
  never into it.
universe: [BTCUSDT-PERP, ETHUSDT-PERP]
packages:
  - key: BTC-liq
    legs: [{symbol: BTCUSDT-PERP, weight: 1.0}]
  - key: ETH-liq
    legs: [{symbol: ETHUSDT-PERP, weight: 1.0}]
timeframe: 4h
allowed_directions: [long]
features: [ret_z_1d, oi_chg_1d, funding_last_ann, bar_ret_z, volume_ratio, rv_ratio]
entry_rules:
  - "1-day return z-score <= -min_drop_z"
  - "open interest change over 1 day <= -min_oi_flush"
  - "latest funding (annualized) <= max_funding_ann (leverage reset)"
  - "Jev toxic_flow <= 1 (forced flow has cleared)"
exit_rules:
  - "take profit at +take_profit_vol_mult * daily vol"
  - "stop at -stop_vol_mult * daily vol"
  - "time stop after max_hold_bars"
expected_holding: "4 hours - 3 days"
params:
  min_drop_z: 2.0
  min_oi_flush: 0.05
  max_funding_ann: 0.05
  take_profit_vol_mult: 1.5
  stop_vol_mult: 1.5
  max_hold_bars: 18
risk:
  risk_per_trade_pct_nav: 0.006
  max_package_notional_pct_nav: 0.15
  rebalance_threshold: 0.5
  exit_on_crisis: true
costs:
  fee_bps_roundtrip: 10
  slippage_bps_roundtrip: 10   # entering right after stress: wider spreads assumed
  funding_note: "Funding is usually negative right after a flush: longs are paid."
liquidity:
  min_bar_notional_volume: 100000000
jev:
  profile: reversion
  allowed_regimes: [mean_reverting, high_vol]
  min_setup_quality: 2
  min_liquidity_quality: 1
  max_toxic_flow: 1
  min_expected_edge: 55
  min_confidence: 0.62
  calibration_horizon_bars: 12     # 2 days
  instructions:
    regime: "Distinguish a leverage flush (high_vol, reverting) from an information-driven repricing or systemic event (crisis)."
    direction: "'long' only if the drop looks forced (OI flush, funding reset) rather than informed."
    toxic_flow: "Score 2-3 if forced selling is still in progress; 0-1 once it has cleared."
    should_trade: "Answer yes only if at least half of the drop is likely to be retraced within 2 days."
invalidation:
  - {metric: rolling_sharpe_90d, op: "<", threshold: 0.0, min_observations: 540, action: demote}
  - {metric: strategy_drawdown, op: ">", threshold: 0.05, action: halt}
  - {metric: hit_rate, op: "<", threshold: 0.40, min_observations: 25, action: demote}
  - {metric: brier_should_trade, op: ">", threshold: 0.25, min_observations: 30, action: demote}
data_sources: [binance_usdm_klines, binance_usdm_funding, binance_usdm_open_interest]
failure_modes:
  - "Catching a falling knife: the drop is informational (hack, insolvency, regulatory) not mechanical."
  - "Second-wave cascade: OI re-builds and flushes again below the stop."
  - "Rare events: few trades per year; statistics stay thin for a long time."
  - "OI history from public endpoints is short (~30 days), limiting real-data backtests without a paid vendor."
capacity_usd: 5000000
research_memo: null
