# Alpha Edge SaaS : fonctions, droits d'accès et plafonds mensuels par offre.
#
# Les droits (entitlements) viennent du catalogue (config/site.yaml) : une fonction est ouverte
# si le membre a le droit indiqué. Les plafonds limitent le coût IA par membre (≤ 10 % du prix
# de l'offre en usage typique, voir docs/SAAS.md). Tous les chiffres sont des hypothèses de
# départ, à recaler après la bêta.

features:
  journal:      {entitlement: journal,        label: "Journal et statistiques"}
  mt5_sync:     {entitlement: mt5_connect,    label: "Synchronisation MT5 (EA Journal Sync)"}
  coach:        {entitlement: journal,        label: "Coach IA (revue du journal)"}
  analysis:     {entitlement: analyses,       label: "Analyste de setup ICT"}
  prop_guard:   {entitlement: performance,    label: "Garde-fou prop firm et alertes"}
  tradingview:  {entitlement: performance,    label: "Alertes TradingView"}
  mentor:       {entitlement: academy_member, label: "Mentor IA sur les contenus de Victor"}
  briefing:     {entitlement: calendar,       label: "Briefing de pré-session"}
  lab:          {entitlement: lab,            label: "Laboratoire de validation"}
  ea_factory:   {entitlement: ea_factory,     label: "Usine EA"}
  public_api:   {entitlement: api,            label: "API (lecture seule)"}

# Plafonds mensuels. La clé est l'offre principale du membre (config/site.yaml) ; « gratuit »
# s'applique à tout compte sans abonnement.
#
# Calibrage (prix des modèles au 2026-06 : Sonnet 5 2 $ / 10 $, Opus 5 5 $ / 25 $ par million de
# jetons en entrée / sortie). Coût typique mesuré sur les budgets des agents :
#   revue du Coach ≈ 0,03 $ ; analyse de setup ≈ 0,035 $ ; question au Mentor ≈ 0,02 $ ;
#   génération d'EA ≈ 1,2 $ (2 à 3 tours) ; backtest : pas d'IA (charge serveur seulement).
# Plafonds utilisés en entier ≈ 12 % du prix de l'offre (Starter 3,5 $ / 29 $, Pro Trader
# 8,4 $ / 79 $, Quant Elite 28 $ / 199 $). ai_budget_usd est le filet de sécurité : au-delà, le
# membre continue d'utiliser le service, avec des textes rédigés par les règles (mêmes chiffres).
# Un trader actif fait 1 à 3 analyses par jour de bourse (≈ 20 jours) : 40 couvre un usage
# quotidien, 120 un usage intensif. Revues hebdomadaires automatiques : hors plafond.
plans:
  gratuit:     {trades_per_month: 100, coach: 4,   analysis: 0,   mentor: 0,   backtest: 0,   ea_run: 0, ai_budget_usd: 0.5}
  starter:     {trades_per_month: 0,   coach: 30,  analysis: 40,  mentor: 60,  backtest: 0,   ea_run: 0, ai_budget_usd: 4}
  pro_trader:  {trades_per_month: 0,   coach: 60,  analysis: 120, mentor: 120, backtest: 30,  ea_run: 0, ai_budget_usd: 10}
  quant_elite: {trades_per_month: 0,   coach: 150, analysis: 300, mentor: 300, backtest: 100, ea_run: 6, ai_budget_usd: 30}
# trades_per_month : 0 = illimité.

journal:
  min_trades_for_stats: 20        # sous ce seuil : INSUFFICIENT_DATA, pas de conclusion
  sample_warning_below: 30        # avertissement « échantillon faible »
  bootstrap_samples: 2000
  default_plan:                   # plan de trading par défaut, modifiable par le membre
    markets: [XAUUSD, NAS100]
    killzones: [London, NY_AM]
    risk_per_trade_pct: 1.0
    max_daily_loss_pct: 3.0
    max_trades_per_day: 3
    revenge_minutes: 15
    size_up_factor: 1.5
    min_rr: 2.0
    setups: [SilverBullet, MacroBreaker]

analysis:
  approval_expiry_min: 120        # une carte de décision expire au bout de 2 h
  debate: false                   # débat contradictoire (Quant Elite) : à activer après mesure de son effet
  symbols: [XAUUSD, NAS100, US30, US500, EURUSD, GBPUSD, XAGUSD, GER40]

workers:
  threads: 2                      # workers dans le processus web ; 0 si un worker séparé tourne
