    headline: "Silver Bullet + Macro Breaker, gestion complète du trade"
    markets: "Or (XAUUSD) et indices US, en M1"
    access: ea_one
  - key: ict_v6
    template: ict_v6
    name: "ICT Ultimate Pro v6"
    status: beta
    headline: "Croisement EMA + Silver Bullet sur fenêtres horaires"
    markets: "Or et indices, en M5 à H1"
    access: ea_one
  - key: next_bot
    name: "Nouveau robot haute performance"
    status: development
    headline: "En développement : il rejoindra le catalogue après validation sur compte démo vérifié."
    markets: "À annoncer"
    access: early_access

