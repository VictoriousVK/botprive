# Registre des modèles approuvés (ADR-006).
# Le code ne connaît que les clés logiques ; ici, des IDs exacts, jamais d'alias flottant.
# Changer un modèle = passer le harness d'évaluation complet, puis le shadow mode, puis un canary
# (voir docs/SAAS.md, section Évaluation).
#
# Prix publics en dollars par million de tokens, relevés en 2026 : À REVÉRIFIER avant chaque
# changement de ce fichier. Ils servent au suivi des coûts et aux plafonds par offre.

cache:
  read_multiplier: 0.1    # lecture du cache de prompt, en fraction du prix d'entrée
  write_multiplier: 1.25  # écriture du cache
batch_discount: 0.5       # API batch (rapports hebdomadaires)

models:
  router:      {model: claude-haiku-4-5, max_tokens: 400,   price_in: 1.0, price_out: 5.0}
  relevance:   {model: claude-haiku-4-5, max_tokens: 800,   price_in: 1.0, price_out: 5.0}
  coach:       {model: claude-sonnet-5,  max_tokens: 4000,  price_in: 2.0, price_out: 10.0}
  analyste:    {model: claude-sonnet-5,  max_tokens: 4000,  price_in: 2.0, price_out: 10.0}
  mentor:      {model: claude-sonnet-5,  max_tokens: 3000,  price_in: 2.0, price_out: 10.0}
  research:    {model: claude-sonnet-5,  max_tokens: 4000,  price_in: 2.0, price_out: 10.0}
  debate:      {model: claude-sonnet-5,  max_tokens: 2500,  price_in: 2.0, price_out: 10.0}
  ea_factory:  {model: claude-opus-5,    max_tokens: 16000, effort: high, price_in: 5.0, price_out: 25.0}
  judge:       {model: claude-opus-5,    max_tokens: 2000,  effort: high, price_in: 5.0, price_out: 25.0}
